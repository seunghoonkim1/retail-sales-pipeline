name: CI

# When to run: on every pull request, and on every push to main
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow can only read the repo
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest # a fresh Linux machine from GitHub, discarded afterward

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5 # same version as your machine

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate each Terraform folder
        run: |
          for dir in infra/bootstrap infra/account; do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
  
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
      
      - name: Run tests
        run: uv run pytest -v
      
      - name: Check dbt project
        working-directory: transform
        run: |
          uv run dbt deps
          uv run dbt parse