models:
  - name: stg_m5__calendar
    description: One row per day, with the Walmart week split into fiscal year and week.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "regexp_matches(wm_yr_wk, '^[01][0-9]{4}$')"
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: fiscal_week
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 53

  - name: stg_m5__sales
    description: Daily units per item and store.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [channel_item_id, store_id, date_day]
    columns:
      - name: units
        data_tests: [not_null]

  - name: stg_m5__prices
    description: Weekly sell price per item and store.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [channel_item_id, store_id, wm_yr_wk]
    columns:
      - name: sell_price_usd
        data_tests: [not_null]
  
  - name: stg_m5__products
    description: One row per SKU per item master snapshot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku]
    columns:
      - name: sku
        data_tests: [not_null]

  - name: stg_m5__channel_items
    description: One row per channel item per item master snapshot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, channel, channel_item_id]
    columns:
      - name: sku
        data_tests: [not_null]