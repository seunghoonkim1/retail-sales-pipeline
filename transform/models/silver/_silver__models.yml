models:
  - name: dim_date
    description: One row per calendar day.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_fiscal_calendar
    description: One row per day per fiscal calendar; complete weeks only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_name, date_day]
    columns:
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: dim_fiscal_week
    description: One row per fiscal week per calendar.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_name, fiscal_year_week]
    columns:
      - name: fiscal_month
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12

  - name: fct_sales_daily
    description: One row per channel item per day, summed across stores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [channel, channel_item_id, date_day]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "pos_units >= 0"
          config:
            severity: warn # negative units can be real (returns): flag, don't fail
    columns:
      - name: channel
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel
      - name: channel_item_id
        data_tests: [not_null]
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: pos_units
        data_tests: [not_null]
      - name: pos_sales_usd
        data_tests:
          - not_null:
              config:
                severity: warn # units sold with no known price: flag for review
      - name: source_file
        data_tests: [not_null]